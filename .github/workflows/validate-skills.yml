name: Validate skills

# Checks every SKILL.md against the Agent Skills spec and this repo's rules,
# and fails if a generated Hermes copy has drifted from its source.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check --quiet pyyaml==6.0.3

      - name: Validate skills
        run: python scripts/validate_skills.py

      - name: Check Hermes copies are in sync
        run: python scripts/sync_hermes_skills.py --check
