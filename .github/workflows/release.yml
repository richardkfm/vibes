name: Release

# Pushing a version tag (v1.2.3, or v1.2.3-rc.1 for a pre-release) validates
# the skills, packages them and publishes a GitHub release.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate-skills.yml

  release:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release and upload its assets
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse tags that are not on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG points at a commit that is not on main."
            exit 1
          fi

      - name: Package skills
        run: |
          mkdir -p dist
          # One zip per skill, with the skill folder at the root: the layout
          # claude.ai expects for an uploaded skill.
          for dir in .claude/skills/*/; do
            name="$(basename "$dir")"
            (cd .claude/skills && zip -qr "$GITHUB_WORKSPACE/dist/$name.zip" "$name")
          done
          # Everything, for a manual install into any agent.
          zip -qr "dist/vibes-skills-$TAG.zip" .claude/skills .hermes/skills README.md LICENSE
          ls -l dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--verify-tag --generate-notes --title "$TAG")
          case "$TAG" in
            *-*) flags+=(--prerelease) ;;
          esac
          gh release create "$TAG" dist/*.zip "${flags[@]}"
